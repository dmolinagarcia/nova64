MEMORY {
    BIOS: start = $E000, size = $1800, fill = yes, fillval = $FF, file = %O;
    SIB:  start = $F800, size = $07E0, fill = yes, fillval = $00, file = %O;
    VEC:  start = $FFE0, size = $0020, fill = yes, file = %O;
}
SEGMENTS {
    JUMPS:   load = BIOS, type = ro;
    CODE:    load = BIOS, type = ro;
    VECTORS: load = VEC,  type = ro;
}
