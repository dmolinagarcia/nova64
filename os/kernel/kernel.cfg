# The kernel is linked bank-relative: every address is 16 bits and the bank is
# KBANK ($FD), which the image header supplies to the loader.
MEMORY {
    KERN: start = $0000, size = $10000, file = %O;
}
SEGMENTS {
    CODE:   load = KERN, type = ro;
    RODATA: load = KERN, type = ro, optional = yes;
    DATA:   load = KERN, type = rw, optional = yes;
    BSS:    load = KERN, type = bss, define = yes, optional = yes;
}
