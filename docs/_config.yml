title: "noVa64"
author: 
   name: "Dani Molina"
   email: "dmolina+nova64@gmail.com"

description: "noVa64 development diary" # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.

show_excerpts: "yes"

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
#twitter_username: "nnn"
#github_username: "nnn"
#linkedin_username: "nnn"
#facebook_username: "nnn"
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
# No theme gem: the site carries its own layouts, includes and stylesheet
# (css/site.css), sharing docsV3's palette and furniture.
url: "https://dmolinagarcia.github.io"
baseurl : "/nova64"
rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-titles-from-headings

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  # Posts and pages carry no layout of their own: the layout is set here, so a
  # new entry needs nothing but its category.
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      tags: Other
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
