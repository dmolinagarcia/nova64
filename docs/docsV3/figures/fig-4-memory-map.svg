<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Physical memory structure with the SRAM on the CPU's shared nets">
  <rect x="40" y="60" width="160" height="70" class="blk"/>
  <text x="120" y="88" class="t">W65C816S</text>
  <text x="120" y="110" class="s">24-bit virtual</text>

  <line x1="200" y1="95" x2="620" y2="95" class="dtb"/>
  <circle cx="390" cy="95" r="5" fill="#7FD8BD"/>
  <text x="400" y="80" class="lbl">D0–D7 + A0–A10 · SHARED NET</text>
  <text x="286" y="120" class="li10">the offset is never translated — it needs no FPGA pin</text>

  <line x1="390" y1="95" x2="390" y2="160" class="dtb"/>
  <rect x="250" y="160" width="250" height="150" class="blk"/>
  <text x="375" y="184" class="t">Helium (FPGA-A)</text>
  <text x="266" y="208" class="li">MMU: VA → PA · TLB (ASID)</text>
  <text x="266" y="226" class="li">walker · cache tags in EBR</text>
  <text x="266" y="244" class="li">arbiter · PHI2 gating</text>
  <text x="375" y="272" class="s">SRAM miss → PHI2 stalled low</text>
  <text x="375" y="290" class="s">BE=0 · Helium takes the nets</text>

  <line x1="500" y1="185" x2="620" y2="185" class="dtb"/>
  <text x="560" y="176" class="lbl">A11–A19 · /CE /OE /WE (12)</text>

  <rect x="620" y="60" width="300" height="160" class="blk"/>
  <text x="770" y="82" class="t">SRAM 1 MB ×8 · 10 ns</text>
  <line x1="620" y1="96" x2="920" y2="96" stroke="rgba(241,236,217,.4)" stroke-width="1"/>
  <line x1="620" y1="146" x2="920" y2="146" stroke="rgba(241,236,217,.4)" stroke-width="1"/>
  <text x="770" y="116" class="s">256 KB pinned · uncached</text>
  <text x="770" y="134" class="s">kernel · page tables · $00 · vectors</text>
  <text x="770" y="166" class="s">768 KB cache · 4-way</text>
  <text x="770" y="184" class="s">384 lines × 2 KB</text>
  <text x="770" y="202" class="s">256 B sub-blocks · valid + dirty</text>

  <line x1="500" y1="270" x2="570" y2="270" class="dtb"/>
  <line x1="570" y1="270" x2="570" y2="360" class="dtb"/>
  <line x1="570" y1="360" x2="620" y2="360" class="dtb"/>
  <text x="596" y="258" class="lbl">39 pins</text>

  <rect x="620" y="320" width="300" height="86" class="blk"/>
  <text x="770" y="344" class="t">SDRAM 64 MB</text>
  <text x="770" y="366" class="s">32,768 frames × 2 KB · AS4C32M16SB</text>
  <text x="770" y="384" class="s">backing store · DMA / paging engine</text>
  <text x="770" y="400" class="s">off the critical timing path</text>

  <line x1="770" y1="406" x2="770" y2="436" class="dts"/>
  <rect x="620" y="436" width="300" height="44" class="blk opt"/>
  <text x="770" y="462" class="s">microSD — page swap · post-v1</text>

  <line x1="120" y1="130" x2="120" y2="350" class="dts"/>
  <text x="178" y="250" class="lbl">$FE window (VRAM_SEL)</text>
  <rect x="40" y="350" width="300" height="86" class="blk"/>
  <text x="190" y="374" class="t">Neon (FPGA-B)</text>
  <text x="190" y="394" class="s">SDRAM 64 MB = chip RAM</text>
  <text x="190" y="412" class="s">framebuffer + audio DMA</text>
  <text x="190" y="428" class="s">outside the CPU hierarchy</text>

  <text x="40" y="470" class="li">TLB ~10 ns · walk ≈ 100 ns</text>
  <text x="40" y="488" class="li">256 B sub-block fill ≈ 6 µs</text>
</svg>
