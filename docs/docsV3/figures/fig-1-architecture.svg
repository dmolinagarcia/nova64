  <text x="172" y="170" class="plbl">RESB</text>

  <rect x="40" y="186" width="170" height="90" class="blk"/>
  <text x="125" y="208" class="t">W65C816S</text>
  <text x="125" y="228" class="s">PLCC-44 · 24-bit native</text>
  <text x="125" y="244" class="s">PHI2 8 MHz · BE</text>
  <rect x="40" y="292" width="170" height="70" class="blk opt"/>
  <text x="125" y="316" class="t">Argon — FPGA-C (opt.)</text>
  <text x="125" y="336" class="s">softcore 65816 · BE=0</text>

  <text x="250" y="176" class="lbl">SHARED A/D/CTRL BUS</text>
  <line x1="250" y1="211" x2="250" y2="448" class="dtb"/>
  <line x1="210" y1="231" x2="250" y2="231" class="dtb"/>
  <line x1="210" y1="327" x2="250" y2="327" class="dts"/>
  <line x1="250" y1="267" x2="290" y2="267" class="dtb"/>
  <line x1="250" y1="448" x2="290" y2="448" class="dtb"/>
  <text x="222" y="464" class="lbl">$FE · VRAM_SEL</text>

  <rect x="290" y="186" width="300" height="162" class="blk"/>
  <text x="440" y="210" class="t">HELIUM — NORTHBRIDGE (FPGA-A)</text>
  <text x="306" y="234" class="li">MMU · TLB ASID · walker HW</text>
  <text x="306" y="252" class="li">768 KB cache · 2 KB lines · 4-way</text>
  <text x="306" y="270" class="li">bus arbiter · PHI2 · timer</text>
  <text x="306" y="288" class="li">PIC priorities · UART · SPI-SD</text>
  <text x="306" y="306" class="li">I2C (RTC · gauge · GT911) · dbg</text>
  <text x="440" y="336" class="s">iCE40HX8K TQ144 · 90/107 pins</text>

  <line x1="590" y1="267" x2="615" y2="267" class="dtb"/>
  <line x1="615" y1="87" x2="615" y2="267" class="dtb"/>
  <line x1="615" y1="87" x2="640" y2="87" class="dtb"/>
  <line x1="615" y1="185" x2="640" y2="185" class="dtb"/>

  <text x="640" y="26" class="eye">MEMORY</text>
  <rect x="640" y="40" width="280" height="94" class="blk"/>
  <text x="780" y="62" class="t">SRAM 1 MB ×8 · 10 ns</text>
  <text x="656" y="84" class="li">256 KB pinned: kernel · tables · $00</text>
  <text x="656" y="100" class="li">768 KB cache · 4-way · tags in EBR</text>
  <text x="656" y="116" class="li">D0–D7 + A0–A10 on the CPU nets</text>
