  <text x="656" y="230" class="li">256 KB pinned: kernel · tables · $00</text>
  <text x="656" y="246" class="li">768 KB cache · 4-way · tags in EBR</text>
  <text x="656" y="262" class="li">D0–D7 + A0–A10 on the CPU nets</text>
