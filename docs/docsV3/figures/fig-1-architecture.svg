<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Global architecture block diagram">
  <text x="40" y="26" class="eye">EC / BOOT</text>
  <rect x="40" y="40" width="230" height="110" class="blk"/>
  <text x="155" y="62" class="t">RP2354B — EC</text>
  <text x="56" y="84" class="li">USB-C power · UART console</text>
  <text x="56" y="100" class="li">USB host + on-board hub</text>
  <text x="56" y="116" class="li">2 MB flash · SSPI · batt.</text>
  <text x="56" y="136" class="li">rail sequencing</text>

  <rect x="300" y="40" width="130" height="60" class="blk"/>
  <text x="365" y="64" class="t">microSD</text>
  <text x="365" y="84" class="s">FAT · BIOS / KERNEL</text>
  <rect x="450" y="40" width="130" height="60" class="blk"/>
  <text x="515" y="64" class="t">'3257 mux</text>
  <text x="515" y="84" class="s">SPI handoff</text>
  <line x1="270" y1="70" x2="300" y2="70" class="dt"/>
  <line x1="430" y1="70" x2="450" y2="70" class="dt"/>
  <line x1="515" y1="100" x2="515" y2="186" class="dt"/>
