  <text x="56" y="116" class="li">W25Q16 · SSPI cfg · batt.</text>
  <text x="56" y="136" class="li">rail sequencing</text>

  <rect x="300" y="40" width="130" height="60" class="blk"/>
  <text x="365" y="64" class="t">microSD</text>
