  <text x="440" y="404" class="t">NEON — VIDEO · AUDIO (FPGA-B)</text>
  <text x="306" y="428" class="li">RGB-TTL 1024×600 (px-doubling)</text>
  <text x="306" y="446" class="li">64 KB VRAM window at $FE</text>
  <text x="306" y="464" class="li">I2S → PCM5102A · VGA R-2R</text>
  <text x="306" y="482" class="li">IRQ VSYNC</text>
  <text x="440" y="506" class="s">iCE40 TQ144 · ~79 pins</text>

  <text x="640" y="294" class="eye">NEON · LOCAL</text>
  <polyline points="590,390 605,390 605,330 640,330" class="dt"/>
  <rect x="640" y="304" width="280" height="52" class="blk"/>
  <text x="780" y="326" class="t">SDRAM 64 MB (AS4C32M16SB)</text>
  <text x="780" y="346" class="s">chip RAM: framebuffer + audio</text>

  <line x1="590" y1="415" x2="640" y2="415" class="dt"/>
  <text x="615" y="408" class="lbl">RGB-TTL</text>
  <text x="615" y="430" class="lbl">51.2 MHz</text>
  <rect x="640" y="380" width="280" height="70" class="blk"/>
  <text x="780" y="402" class="t">10.1&#8221; IPS PANEL</text>
  <text x="780" y="422" class="s">ER-TFT101-1 · HX8282 · FPC-50</text>
  <text x="780" y="438" class="s">GT911 capacitive → I2C + INT</text>

  <line x1="590" y1="492" x2="640" y2="492" class="dt"/>
  <text x="615" y="485" class="lbl">I2S</text>
  <rect x="640" y="466" width="280" height="52" class="blk"/>
  <text x="780" y="488" class="t">PCM5102A</text>
  <text x="780" y="508" class="s">I2S → audio jack</text>

  <polyline points="590,502 605,502 605,554 640,554" class="dts"/>
  <rect x="640" y="534" width="280" height="40" class="blk opt"/>
  <text x="780" y="559" class="s">VGA (R-2R) — bring-up</text>
</svg>
