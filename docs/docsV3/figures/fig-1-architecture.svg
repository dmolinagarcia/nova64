  <text x="306" y="490" class="li">I2S → PCM5102A · VGA R-2R</text>
  <text x="306" y="508" class="li">IRQ VSYNC</text>
  <text x="440" y="532" class="s">iCE40 TQ144 · ~79 pins</text>

  <line x1="590" y1="438" x2="640" y2="438" class="dt"/>
  <rect x="640" y="406" width="280" height="64" class="blk"/>
  <text x="780" y="428" class="t">SDRAM 64 MB (AS4C32M16SB)</text>
  <text x="780" y="448" class="s">chip RAM: framebuffer + audio</text>

  <line x1="590" y1="516" x2="680" y2="516" class="dts"/>
  <rect x="680" y="496" width="170" height="44" class="blk opt"/>
  <text x="765" y="522" class="s">VGA (R-2R) — bring-up</text>

  <line x1="370" y1="546" x2="370" y2="576" class="dt"/>
  <text x="452" y="564" class="lbl">RGB-TTL · 51.2 MHz</text>
  <rect x="270" y="576" width="210" height="70" class="blk"/>
  <text x="375" y="598" class="t">10.1&#8221; IPS PANEL</text>
  <text x="375" y="617" class="s">ER-TFT101-1 · HX8282 · FPC-50</text>
  <text x="375" y="633" class="s">GT911 capacitive → I2C + INT</text>

  <line x1="560" y1="546" x2="560" y2="576" class="dt"/>
