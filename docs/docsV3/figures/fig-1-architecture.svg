  <line x1="615" y1="236" x2="640" y2="236" class="dtb"/>
  <line x1="615" y1="346" x2="640" y2="346" class="dtb"/>

  <text x="640" y="176" class="eye">MEMORY</text>
  <rect x="640" y="186" width="280" height="100" class="blk"/>
