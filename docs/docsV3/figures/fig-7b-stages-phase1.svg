    <circle cx="480" cy="420" r="9" fill="#0E3A2C" stroke="#F1ECD9" stroke-width="1.4"/>
    <circle cx="585" cy="420" r="9" fill="#0E3A2C" stroke="#F1ECD9" stroke-width="1.4"/>
    <circle cx="690" cy="420" r="9" fill="#0E3A2C" stroke="#F1ECD9" stroke-width="1.4"/>
    <circle cx="795" cy="420" r="9" fill="#0E3A2C" stroke="#F1ECD9" stroke-width="1.4"/>
    <circle cx="900" cy="420" r="9" fill="#0E3A2C" stroke="#F1ECD9" stroke-width="1.4"/>
    <path d="M60 411 a9 9 0 0 0 0 18 z" fill="#F1ECD9"/>

    <text x="60" y="400" class="nlbl">E0</text>
    <text x="165" y="400" class="nlbl">E1</text>
    <text x="270" y="400" class="nlbl">E2</text>
    <text x="375" y="400" class="nlbl">E3</text>
    <text x="480" y="400" class="nlbl">E4</text>
    <text x="585" y="400" class="nlbl">E5</text>
    <text x="690" y="400" class="nlbl">E6</text>
    <text x="795" y="400" class="nlbl">E7</text>
    <text x="900" y="400" class="nlbl">E8</text>

