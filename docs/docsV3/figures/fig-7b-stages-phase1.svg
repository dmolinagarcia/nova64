    <text x="165" y="444" class="s">free-run</text>
    <text x="270" y="444" class="s">SRAM+monitor</text>
    <text x="375" y="444" class="s">SDRAM</text>
    <text x="480" y="444" class="s">MMU+prot</text>
    <text x="585" y="444" class="s">video·audio</text>
    <text x="690" y="444" class="s">SD+min. OS</text>
    <text x="795" y="444" class="s">multitasking</text>
    <text x="900" y="444" class="s">laptop+GUI</text>
