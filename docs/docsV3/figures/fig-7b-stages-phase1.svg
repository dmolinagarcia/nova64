  <text x="270" y="230" class="nlbl">P2</text>
  <text x="375" y="230" class="nlbl">P3</text>
  <text x="480" y="230" class="nlbl">P4</text>
  <text x="585" y="230" class="nlbl">P5</text>

  <text x="60" y="274" class="s">platform alive</text>
  <text x="165" y="274" class="s">console before mem</text>
  <text x="270" y="274" class="s">CPU attached</text>
  <text x="375" y="274" class="s">translation</text>
  <text x="480" y="274" class="s">graphics</text>
  <text x="585" y="274" class="s">system</text>

  <line x1="60" y1="322" x2="300" y2="322" class="dts"/>
  <text x="480" y="326" class="s">the prototype validates the gateware the E-series then commits to a PCB</text>
  <line x1="660" y1="322" x2="900" y2="322" class="dts"/>

  <g opacity="0.35">
