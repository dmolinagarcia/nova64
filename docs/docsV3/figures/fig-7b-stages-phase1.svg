<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three build phases with Phase 1 highlighted: the P0 to P5 prototype carrier in the middle, the S0 to S11 training rig above it and the E0 to E8 target board below">

  <rect x="38" y="184" width="3" height="98" fill="#7FD8BD"/>

