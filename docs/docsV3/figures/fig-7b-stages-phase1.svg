  <rect x="640" y="234" width="216" height="32" fill="rgba(217,169,63,.07)" stroke="#D9A93F" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="748" y="254" class="htx">APPLE II · ON THE PROTOTYPE</text>
  <polyline points="594,250 640,250" class="pwd"/>

