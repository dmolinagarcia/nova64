<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon — the two paths through the GPU: the bitstream-initialised text path and the command-driven graphics path">

  <!-- EC -->
  <rect x="20" y="60" width="190" height="84" class="blk"/>
  <text x="115" y="84" class="t">RP2040 · EC</text>
  <text x="115" y="104" class="s">service port — the four</text>
  <text x="115" y="120" class="s">SPI pins, reused after</text>
  <text x="115" y="136" class="s">configuration</text>

  <!-- CPU -->
  <rect x="20" y="160" width="190" height="84" class="blk"/>
  <text x="115" y="184" class="t">W65C816S · via Helium</text>
  <text x="115" y="204" class="s">writes commands and</text>
  <text x="115" y="220" class="s">assets, never pixels</text>
  <text x="115" y="236" class="s">~1.3 MB/s</text>

  <!-- EC into the service port -->
  <line x1="210" y1="102" x2="248" y2="102" class="pw"/>
  <text x="229" y="94" class="plbl">SPI</text>

  <!-- CPU into the aperture, and the three control lines -->
  <line x1="210" y1="180" x2="248" y2="180" class="dt"/>
  <text x="300" y="266" class="lbl">$FE aperture · 64 KB</text>
  <line x1="210" y1="204" x2="248" y2="204" class="dts"/>
  <line x1="210" y1="228" x2="248" y2="228" class="dts"/>

  <!-- Neon -->
  <rect x="230" y="40" width="560" height="470" class="blk"/>
  <text x="510" y="62" class="t">NEON · FPGA-B — iCE40 HX8K · one clock domain at 103.125 MHz</text>

  <rect x="248" y="84" width="124" height="52" class="blk"/>
  <text x="310" y="106" class="t">service port</text>
  <text x="310" y="124" class="s">reaches everything</text>

  <rect x="248" y="148" width="124" height="96" class="blk"/>
  <text x="310" y="170" class="t">aperture</text>
  <text x="310" y="190" class="s">write FIFO · 32</text>
  <text x="310" y="206" class="s">registers $FE:FF00</text>
  <text x="310" y="222" class="s">BWAIT on a read</text>
  <text x="310" y="238" class="s">VRAM_SEL gates it</text>

  <!-- text path -->
  <rect x="388" y="84" width="232" height="64" class="blk"/>
  <text x="504" y="106" class="t">EBR — 32 of 32 blocks</text>
  <text x="504" y="124" class="s">text buffer 8 KB · font 4 KB · palette 1 KB</text>
  <text x="504" y="140" class="s">initialised from the bitstream</text>

  <rect x="388" y="164" width="232" height="48" class="blk"/>
  <text x="504" y="184" class="t">character generator</text>
  <text x="504" y="202" class="s">three stages · no line buffer · 8× of slack</text>

  <line x1="372" y1="108" x2="388" y2="108" class="pw"/>
  <line x1="372" y1="180" x2="388" y2="132" class="dt"/>
  <line x1="504" y1="148" x2="504" y2="164" class="dt"/>
  <line x1="620" y1="188" x2="636" y2="188" class="dt"/>

  <!-- graphics path -->
  <line x1="310" y1="244" x2="310" y2="268" class="dt"/>
  <rect x="248" y="268" width="176" height="58" class="blk"/>
  <text x="336" y="290" class="t">command processor</text>
  <text x="336" y="308" class="s">FIFO 128 · lists in SDRAM</text>

  <line x1="336" y1="326" x2="336" y2="342" class="dt"/>
  <rect x="248" y="342" width="176" height="58" class="blk"/>
  <text x="336" y="364" class="t">blitter</text>
  <text x="336" y="382" class="s">fill · copy · keyed · expand</text>

  <rect x="440" y="240" width="180" height="58" class="blk"/>
  <text x="530" y="262" class="t">graphics scanout</text>
  <text x="530" y="280" class="s">line buffer ×2 · replication</text>

  <rect x="440" y="318" width="180" height="82" class="blk"/>
  <text x="530" y="342" class="t">arbiter · SDRAM controller</text>
  <text x="530" y="362" class="s">four ways, one clock domain,</text>
  <text x="530" y="378" class="s">no domain crossing anywhere</text>

  <line x1="424" y1="365" x2="440" y2="365" class="dt"/>
  <line x1="530" y1="318" x2="530" y2="298" class="dt"/>
  <line x1="620" y1="269" x2="636" y2="269" class="dt"/>

  <!-- output and timing -->
  <rect x="636" y="84" width="138" height="200" class="blk"/>
  <text x="705" y="108" class="t">output stage</text>
  <text x="705" y="132" class="s">palette</text>
  <text x="705" y="148" class="s">256 × RGB666</text>
  <text x="705" y="172" class="s">hardware cursor</text>
  <text x="705" y="196" class="s">border colour</text>
  <text x="705" y="220" class="s">18 bpp to the</text>
  <text x="705" y="236" class="s">panel, unmodified</text>
  <text x="705" y="264" class="s">262,144 colours</text>

  <rect x="636" y="304" width="138" height="96" class="blk"/>
  <text x="705" y="326" class="t">timing generator</text>
  <text x="705" y="346" class="s">1344 × 640</text>
  <text x="705" y="362" class="s">59.95 Hz</text>
  <text x="705" y="382" class="s">PCLK 51.5625 MHz</text>

  <line x1="705" y1="304" x2="705" y2="284" class="dt"/>

  <!-- SDRAM, off-chip -->
  <line x1="530" y1="400" x2="530" y2="530" class="dt"/>
  <rect x="330" y="530" width="360" height="52" class="blk"/>
  <text x="510" y="552" class="t">AS4C32M16SB · 64 MB · 16-bit · 206 MB/s peak</text>
  <text x="510" y="570" class="s">framebuffers · atlases · level buffers · command lists — scanout takes under 3%</text>

  <!-- panel -->
  <line x1="774" y1="170" x2="820" y2="170" class="dtb"/>
  <rect x="820" y="110" width="128" height="120" class="blk"/>
  <text x="884" y="140" class="t">10.1" panel</text>
  <text x="884" y="162" class="s">1024 × 600</text>
  <text x="884" y="182" class="s">RGB-TTL</text>
  <text x="884" y="202" class="s">ER-TFT101-1</text>
  <text x="884" y="220" class="s">no bridge chip</text>

  <!-- the two claims the figure exists to make -->
  <text x="504" y="446" class="htx">MODE 0 TAKES THE TOP PATH ONLY — NO SDRAM, NO ARBITER, NO CPU</text>
  <text x="504" y="470" class="s">a correct screen exists the moment CDONE rises, before Helium is configured and before the 65816 leaves reset</text>
  <text x="504" y="492" class="s">everything below the aperture is Modes 1 and 2, where the CPU emits commands and the blitter writes the pixels</text>

  <!-- inter-FPGA control lines -->
  <text x="115" y="290" class="lbl">VRAM_SEL in · BWAIT out</text>
  <text x="115" y="306" class="lbl">IRQ out → Helium's PIC</text>
  <line x1="115" y1="244" x2="115" y2="278" class="dts"/>
</svg>
