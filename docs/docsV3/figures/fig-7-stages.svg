<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two build tracks: the P0 to P5 prototype path above, the E0 to E8 target path below with both milestones">

