<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Boot state machine">
  <line x1="144" y1="34" x2="144" y2="410" class="pw"/>
  <text transform="rotate(-90 130 220)" x="130" y="220" class="plbl">EC PHASE (PRE-CPU) — S0…S6</text>
  <line x1="144" y1="428" x2="144" y2="524" class="dt"/>
  <text transform="rotate(-90 130 476)" x="130" y="476" class="lbl">65816</text>

  <circle cx="172" cy="54" r="11" fill="#0E3A2C" stroke="#D9A93F" stroke-width="1.5"/>
  <text x="172" y="58" class="s">S0</text>
  <rect x="196" y="32" width="470" height="44" class="blk"/>
  <text x="431" y="59" class="t">EC boots from in-package flash · active slot selected</text>
  <line x1="431" y1="76" x2="431" y2="88" class="dt"/>

  <circle cx="172" cy="110" r="11" fill="#0E3A2C" stroke="#D9A93F" stroke-width="1.5"/>
  <text x="172" y="114" class="s">S1</text>
  <rect x="196" y="88" width="470" height="44" class="blk"/>
  <text x="431" y="115" class="t">Rails in REV C order: 1V2 → 3V3_MAIN, each PG awaited</text>
  <line x1="431" y1="132" x2="431" y2="144" class="dt"/>

  <circle cx="172" cy="166" r="11" fill="#0E3A2C" stroke="#D9A93F" stroke-width="1.5"/>
  <text x="172" y="170" class="s">S2</text>
  <rect x="196" y="144" width="470" height="44" class="blk"/>
  <text x="431" y="171" class="t">Neon configured from EC flash — CDONE_B ↑</text>
  <line x1="666" y1="166" x2="692" y2="166" class="op"/>
  <line x1="431" y1="188" x2="431" y2="200" class="dt"/>
  <text x="674" y="205" class="gtx">▲ the panel is alive from here — every state below</text>
  <text x="674" y="219" class="gtx">   reports on the machine's own screen</text>

  <circle cx="172" cy="222" r="11" fill="#0E3A2C" stroke="#D9A93F" stroke-width="1.5"/>
  <text x="172" y="226" class="s">S3</text>
  <rect x="196" y="200" width="470" height="44" class="blk"/>
  <text x="431" y="227" class="t">Helium configured — CDONE_A ↑ · the mailbox exists</text>
  <line x1="666" y1="222" x2="692" y2="222" class="op"/>
  <line x1="431" y1="244" x2="431" y2="256" class="dt"/>

  <circle cx="172" cy="278" r="11" fill="#0E3A2C" stroke="#D9A93F" stroke-width="1.5"/>
  <text x="172" y="282" class="s">S4</text>
  <rect x="196" y="256" width="470" height="44" class="blk opt"/>
  <text x="431" y="283" class="t">FPGA-C if populated — skipped on timeout</text>
  <line x1="431" y1="300" x2="431" y2="312" class="dt"/>

  <circle cx="172" cy="334" r="11" fill="#0E3A2C" stroke="#D9A93F" stroke-width="1.5"/>
  <text x="172" y="338" class="s">S5</text>
  <rect x="196" y="312" width="470" height="44" class="blk"/>
  <text x="431" y="339" class="t">bios.bin → pinned SRAM by MEM_WRITE · verified</text>
  <line x1="431" y1="356" x2="431" y2="368" class="dt"/>

  <circle cx="172" cy="390" r="11" fill="#0E3A2C" stroke="#7FD8BD" stroke-width="1.5"/>
  <text x="172" y="394" class="s">S6</text>
  <rect x="196" y="368" width="470" height="44" class="blk"/>
  <text x="431" y="395" class="t">RESB ↑ — the 65816 boots via $FFFC</text>
  <line x1="431" y1="412" x2="431" y2="424" class="dt"/>

  <rect x="196" y="424" width="470" height="44" class="blk"/>
  <text x="431" y="451" class="t">BIOS: init · console · mounts NVFS · loads KERNEL.BIN</text>
  <line x1="431" y1="468" x2="431" y2="480" class="dt"/>

  <rect x="196" y="480" width="470" height="44" class="blk"/>
  <text x="431" y="507" class="t">Kernel: drivers · processes → prompt</text>
  <text x="196" y="546" class="gtx">= APPLE II MILESTONE (E6)</text>

  <rect x="692" y="144" width="232" height="44" class="blk opt"/>
  <text x="808" y="171" class="t">S_FAIL — halt</text>

  <rect x="692" y="424" width="232" height="100" class="blk"/>
  <text x="808" y="452" class="t">S7_RUNTIME</text>
  <text x="808" y="472" class="s">EC, in parallel with the CPU:</text>
  <text x="808" y="488" class="s">HID · console · power management</text>
  <text x="808" y="504" class="s">· firmware update requests</text>
  <line x1="666" y1="446" x2="692" y2="446" class="op"/>

  <text x="674" y="252" class="li10">Nothing outside the EC's own package</text>
  <text x="674" y="268" class="li10">is read before the CPU runs — no microSD</text>
  <text x="674" y="284" class="li10">anywhere in S0…S6.</text>
</svg>
