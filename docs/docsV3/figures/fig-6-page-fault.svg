<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Address translation and PTE format">
  <text x="60" y="38" class="eye">24-BIT VIRTUAL ADDRESS + ASID</text>
  <rect x="60" y="50" width="206" height="44" class="blk"/>
  <rect x="266" y="50" width="174" height="44" class="blk"/>
  <text x="163" y="77" class="s">PAGE · 13 b</text>
  <text x="353" y="77" class="s">OFFSET · 11 b</text>
  <line x1="163" y1="94" x2="163" y2="130" class="dt"/>

  <rect x="60" y="130" width="260" height="70" class="blk"/>
  <text x="190" y="154" class="t">TLB — EBR</text>
  <text x="190" y="174" class="s">32–64 entries · ASID tag</text>
  <text x="190" y="190" class="s">no flush on context switch</text>

  <line x1="320" y1="165" x2="560" y2="165" class="dt"/>
  <text x="440" y="157" class="lbl">HIT</text>
  <rect x="560" y="130" width="340" height="70" class="blk"/>
  <text x="730" y="154" class="t">PHYSICAL ADDR · 27 b</text>
  <text x="730" y="176" class="s">FRAME·2048 + offset · ≤ 128 MB</text>

  <line x1="190" y1="200" x2="190" y2="250" class="dt"/>
  <text x="218" y="228" class="lbl">MISS</text>
  <line x1="110" y1="250" x2="110" y2="200" class="dts"/>

  <rect x="60" y="250" width="260" height="60" class="blk"/>
  <text x="190" y="274" class="t">WALKER HW</text>
  <text x="190" y="294" class="s">≈100 ns · 4 SRAM accesses (8-bit)</text>
  <line x1="320" y1="280" x2="400" y2="280" class="dt"/>
  <rect x="400" y="250" width="240" height="60" class="blk"/>
  <text x="520" y="274" class="t">FLAT TABLE</text>
  <text x="520" y="294" class="s">8,192 PTEs × 32 b = 32 KB/proc</text>
  <line x1="520" y1="310" x2="520" y2="370" class="dt"/>

  <text x="700" y="222" class="eye">BANK MAP</text>
  <rect x="700" y="230" width="210" height="130" class="blk"/>
  <line x1="700" y1="256" x2="910" y2="256" stroke="rgba(241,236,217,.35)" stroke-width="1"/>
  <line x1="700" y1="282" x2="910" y2="282" stroke="rgba(241,236,217,.35)" stroke-width="1"/>
  <line x1="700" y1="308" x2="910" y2="308" stroke="rgba(241,236,217,.35)" stroke-width="1"/>
  <line x1="700" y1="334" x2="910" y2="334" stroke="rgba(241,236,217,.35)" stroke-width="1"/>
  <text x="708" y="248" class="li10">$FF · privileged I/O</text>
  <text x="708" y="274" class="li10">$FE · 64K VRAM window</text>
  <text x="708" y="300" class="li10">$02–$FD · user</text>
  <text x="708" y="326" class="li10">$01 · kernel 64 K pinned</text>
  <text x="708" y="352" class="li10">$00 · stack·DP + priv. zone</text>

  <text x="60" y="358" class="eye">PTE — 32 BITS</text>
  <rect x="60" y="370" width="400" height="44" class="blk"/>
  <text x="260" y="397" class="s">FRAME[15:0]</text>
  <rect x="460" y="370" width="30" height="44" class="blk"/><text x="475" y="397" class="s">P</text>
  <rect x="490" y="370" width="30" height="44" class="blk"/><text x="505" y="397" class="s">W</text>
  <rect x="520" y="370" width="30" height="44" class="blk"/><text x="535" y="397" class="s">X</text>
  <rect x="550" y="370" width="30" height="44" class="blk"/><text x="565" y="397" class="s">U</text>
  <rect x="580" y="370" width="30" height="44" class="blk"/><text x="595" y="397" class="s">D</text>
  <rect x="610" y="370" width="30" height="44" class="blk"/><text x="625" y="397" class="s">A</text>
  <rect x="640" y="370" width="40" height="44" class="blk"/><text x="660" y="397" class="s">NC</text>
  <rect x="680" y="370" width="44" height="44" class="blk"/><text x="702" y="397" class="s">PIN</text>
  <rect x="724" y="370" width="186" height="44" class="blk"/><text x="817" y="397" class="s">SW[7:0]</text>

  <line x1="592" y1="414" x2="592" y2="450" class="dt"/>
  <text x="700" y="432" class="lbl">P=0 · W/X/U violation</text>
  <rect x="60" y="450" width="430" height="64" class="blk"/>
  <text x="275" y="472" class="t">VIOLATION / NOT PRESENT</text>
  <text x="275" y="490" class="s">ABORTB → exact instruction retry</text>
  <text x="275" y="506" class="s">VPA = X permission · VPB = privilege</text>
  <line x1="490" y1="482" x2="520" y2="482" class="dt"/>
  <rect x="520" y="450" width="390" height="64" class="blk"/>
  <text x="715" y="472" class="t">REGISTERS AT $FF</text>
  <text x="715" y="490" class="s">FAULT_ADDR · FAULT_CAUSE</text>
  <text x="715" y="506" class="s">CONTEXT · MODE → the kernel decides</text>
</svg>
