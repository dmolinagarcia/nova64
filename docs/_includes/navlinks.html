{%- if page.previous.url or page.next.url -%}
<nav class="pager">
  {%- if page.previous.url -%}
  <div class="pv"><b>Previous</b><a href="{{ page.previous.url | relative_url }}">⇠ {{ page.previous.title | escape }}</a></div>
  {%- endif -%}
  {%- if page.next.url -%}
  <div class="nx"><b>Next</b><a href="{{ page.next.url | relative_url }}">{{ page.next.title | escape }} ⇢</a></div>
  {%- endif -%}
</nav>
{%- endif -%}
