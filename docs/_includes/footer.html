{%- comment -%} The title block, as on a drawing: who, what, where. {%- endcomment -%}
<footer class="cajetin" aria-label="Title block">
  <div class="cj">
    <div class="big">{{ site.title | upcase }}</div>
    <div>{{ site.description }}</div>
  </div>
  <div class="cj">
    <div><span class="gold">AUTHOR</span> · {{ site.author.name }}</div>
    <div><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></div>
  </div>
  <div class="cj">
    <div><span class="gold">LINKS</span></div>
    <div>
      <a href="https://github.com/dmolinagarcia/nova64">github</a> ·
      <a href="https://www.linkedin.com/in/danielmolinagarcia/">linkedin</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">rss</a> ·
      <a href="{{ '/docsV3/' | relative_url }}">synthesis document</a>
    </div>
  </div>
</footer>
