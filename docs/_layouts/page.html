---
layout: default
---
<article class="hoja">

  <header class="sechead">
    <span class="des">{{ page.title | slice: 0 | upcase }}</span>
    <h2>{{ page.title | upcase | escape }}</h2>
    {%- if page.aim %}<span class="aim">{{ page.aim }}</span>{%- endif %}
    <span class="sheet">{{ site.title }}</span>
  </header>

  <div class="prosa">
    {{ content }}
  </div>

</article>
